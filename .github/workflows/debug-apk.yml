name: debug-apk

# 手动触发的 debug 包构建（full 形态，嵌入 runtime.zip，可直接安装运行）
# 对标 android-build.yml 的 build-apk job (full 矩阵)，但去掉：
#   - release 签名材料 / publish 流程 / 16KB 校验 / runtime 架构校验
#   - preview/edge/release/monitor 等发布 job
# 仅保留：checkout → setup JDK 17 → setup Gradle 8.9 → build-runtime.sh → gradle assembleDebug -Ppackage=full -PruntimeZip=...
# 产物：upload-artifact debug APK（arm64-v8a 一个）

on:
  workflow_dispatch:
  push:
    branches: ["feat/translate-plugin-desc", "sync/upstream-1.4.40"]

env:
  TZ: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘并报告可用空间
        run: |
          echo "--- before ---"
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "--- after ---"
          df -h / | tail -1
          free -m | head -2

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 构建 runtime.zip (arm64-v8a)
        run: |
          set -euo pipefail
          chmod +x scripts/build-runtime.sh
          ./scripts/build-runtime.sh --abi arm64-v8a --out runtime.zip
          echo "runtime.zip built: $(ls -lh runtime.zip)"

      - name: 构建 debug APK (full, embedded runtime)
        env:
          # 显式告诉 gradle 不要 release 签名
          DSH_RELEASE_STORE_PASSWORD: ""
        run: |
          set -o pipefail
          ARGS=(
            -Pabi=${{ matrix.abi }}
            -Ppackage=full
            -PruntimeZip="${{ github.workspace }}/runtime.zip"
          )
          # 不传 -PhardsshDir，让 Gradle 回退到 src/main/assets/hardssh（不存在则仅警告，不阻断）。
          gradle -p . assembleDebug "${ARGS[@]}" --stacktrace 2>&1 | tee build-${{ matrix.abi }}-full.log

      - name: Gradle-Log hochladen + 失败摘要
        if: failure()
        run: |
          # 提取关键错误信息到 Step Summary
          for f in build-*-full.log; do
            if [ -f "$f" ]; then
              echo "## Gradle Build Failure Summary ($f)" >> "$GITHUB_STEP_SUMMARY"
              grep -nE -A8 "What went wrong|^e: |Caused by:" "$f" | head -80 >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
        shell: bash

      - name: Gradle-Log hochladen（Fehlerfall）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ matrix.abi }}-full
          path: build*.log
          retention-days: 3

      - name: 重命名并上传 debug APK
        run: |
          set -euo pipefail
          mkdir -p dist
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          REF="${GITHUB_REF_NAME//\//-}"
          if [ "$REF" = "v$V" ]; then
            BASE="dsh-android-${REF}-${{ matrix.abi }}"
          else
            BASE="dsh-android-${REF}-${{ matrix.abi }}-v${V}"
          fi
          BASE="${BASE}-full"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${BASE}-debug.apk"
          echo "APK_PATH=dist/${BASE}-debug.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug-${{ matrix.abi }}-full
          path: dist/*.apk
          retention-days: 3

